[project]
name = "aro-hcp"
version = "0.1.0"
description = "Agent that provisions Azure Red Hat OpenShift clusters with hosted control planes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Kumudu Herath", email = "kumuduh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only `aro-hcp agent` needs the SDK, and it imports it lazily. Everyone
# driving the deterministic subcommands skips the install.
# Capped below 2: the 2.x tool_runner sends a request field (`thread`) that
# Anthropic-compatible gateways reached through ANTHROPIC_BASE_URL (e.g.
# Vertex) reject, so `aro-hcp agent` failed on its first call. 0.84 works.
agent = ["anthropic>=0.69,<2"]

[project.urls]
Homepage = "https://github.com/kumuduh/aro-hcp-agent"
Issues = "https://github.com/kumuduh/aro-hcp-agent/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # The agent guardrail tests exercise build_tools(), which needs the SDK.
    # Same cap as the [agent] extra; see the comment there.
    "anthropic>=0.69,<2",
]

[project.scripts]
aro-hcp = "aro_hcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
